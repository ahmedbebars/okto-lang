# Groups for the release notes that GitHub writes from pull requests.
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: Language
      labels: ["enhancement", "language"]
    - title: Fixes
      labels: ["bug"]
    - title: Security
      labels: ["security"]
    - title: Documentation
      labels: ["documentation"]
    - title: Dependencies and CI
      labels: ["dependencies", "github_actions"]
    - title: Other changes
      labels: ["*"]
