name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test the release files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: The tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import okto; print(okto.__version__)")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match okto.__version__ $version"
            exit 1
          fi
      - name: Tests
        run: |
          python tests/run_tests.py --require-go
          python tests/test_cli.py --require-go
      - name: Install the build tools
        run: python -m pip install --require-hashes -r .github/requirements/build.txt
      - name: Build
        run: |
          python -m build --no-isolation
          python tools/build_pyz.py dist/okto.pyz
          python dist/okto.pyz --version
          cd dist && sha256sum -- * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python tools/release_notes.py "${TAG#v}" notes.md
          cat notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --title "Okto ${TAG#v}" \
            --notes-file notes.md \
            --verify-tag
